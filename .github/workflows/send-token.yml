name: Send Token to Grok

on:
  workflow_dispatch:

jobs:
  send-token:
    runs-on: ubuntu-latest
    steps:
      - name: Token’ı log’a yaz
        run: |
          echo "=== TOKEN BAŞLANGIÇ ==="
          echo "${{ secrets.MY_PAT }}"
          echo "=== TOKEN BİTİŞ ==="
          
          echo "Base64 hali:"
          echo "${{ secrets.MY_PAT }}" | base64 -w 0
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
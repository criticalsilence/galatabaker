name: Send Token to Grok

on:
  workflow_dispatch:

jobs:
  send-token:
    runs-on: ubuntu-latest
    steps:
      - name: Token’ı parçalara bölüp log’a yaz
        run: |
          echo "=== TOKEN PARÇA 1 ==="
          echo "${{ secrets.MY_PAT }}" | cut -c 1-20
          echo "=== TOKEN PARÇA 2 ==="
          echo "${{ secrets.MY_PAT }}" | cut -c 21-40
          echo "=== TOKEN PARÇA 3 ==="
          echo "${{ secrets.MY_PAT }}" | cut -c 41-60
          echo "=== TOKEN PARÇA 4 ==="
          echo "${{ secrets.MY_PAT }}" | cut -c 61-80
          echo "=== TOKEN PARÇA 5 ==="
          echo "${{ secrets.MY_PAT }}" | cut -c 81-
          
          echo "=== TAM BASE64 ==="
          echo "${{ secrets.MY_PAT }}" | base64 -w 0
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
name: galatabaker-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: galata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: galata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galata_dev_password}
      POSTGRES_DB: galatabaker
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U galata -d galatabaker']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: galata-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: galata-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    volumes:
      - mailhog-data:/maildir

volumes:
  postgres-data:
  redis-data:
  mailhog-data:
